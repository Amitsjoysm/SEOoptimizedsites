# Supervisor configuration for TechResona Backend
# Place this file in: /etc/supervisor/conf.d/techresona-backend.conf

[program:techresona-backend]
command=/path/to/backend/venv/bin/uvicorn server:app --host 127.0.0.1 --port 9001 --workers 2
directory=/path/to/backend
user=your-username
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/techresona-backend.err.log
stdout_logfile=/var/log/supervisor/techresona-backend.out.log
environment=PATH="/path/to/backend/venv/bin"

# After creating this file, run:
# sudo supervisorctl reread
# sudo supervisorctl update
# sudo supervisorctl start techresona-backend
# sudo supervisorctl status techresona-backend
